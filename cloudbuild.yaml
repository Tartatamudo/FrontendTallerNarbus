# ============================================================
# cloudbuild.yaml — FrontendTallerNarbus
#
# Google Cloud Build — Trigger conectado a GitHub (rama: main)
# Flujo: Push a main → Cloud Build → Artifact Registry → Cloud Run
#
# VARIABLES DE SUSTITUCIÓN (configurar en el Trigger de Cloud Build):
#   _REGION              ej: us-central1 o southamerica-east1
#   _SERVICE_NAME        ej: narbus-frontend
#   _ARTIFACT_REPO       ej: narbus-docker
#   _PROJECT_ID          auto-disponible como $PROJECT_ID
#
# SECRETOS (configurar en Secret Manager de GCP):
#   Acceder desde Cloud Build via secretEnv o _VITE_API_BASE_URL como substitución
#   Recomendado: usar Substitution Variables del Trigger para VITE_API_BASE_URL
#   ya que es un build-arg que se hornea en el bundle, no un secreto de runtime.
# ============================================================

steps:
  # ── Paso 1: Build de la imagen Docker ──────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_BASE_URL=${_VITE_API_BASE_URL}'
      - '--build-arg'
      - 'VITE_API_URL=${_VITE_API_URL}'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'
      - '--tag'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--tag'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'

  # ── Paso 2: Push al Artifact Registry ──────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}'
    waitFor: ['build']

  # ── Paso 3: Deploy a Cloud Run ──────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'       # El frontend es público
      - '--port'
      - '80'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'                             # Escala a 0 cuando no hay tráfico (ahorra costo)
      - '--max-instances'
      - '5'
      - '--concurrency'
      - '80'
    waitFor: ['push']

# ── Imagen final en Artifact Registry ──────────────────────
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'

# ── Configuración del build ─────────────────────────────────
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_MEDIUM'             # Más rápido que el default para builds de Node
  dynamic_substitutions: true

timeout: '900s'                        # 15 minutos máximo

# ── Variables de sustitución con defaults ───────────────────
substitutions:
  _REGION: 'us-central1'              # Cambiar a tu región
  _SERVICE_NAME: 'narbus-frontend'
  _ARTIFACT_REPO: 'narbus-docker'
  _VITE_API_BASE_URL: ''              # Obligatorio: setear en el Trigger de Cloud Build
  _VITE_API_URL: ''                   # Obligatorio: setear en el Trigger de Cloud Build
