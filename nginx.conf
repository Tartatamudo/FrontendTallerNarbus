# ============================================================
# nginx.conf — FrontendTallerNarbus
# Configuración de producción para SPA React + Vite
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compresión Gzip ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Headers de Seguridad ────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=self, microphone=(), geolocation=()" always;

    # ── Endpoint de Salud para Healthcheck Docker ───────────
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── Assets con Hash (Vite los nombra con hash de contenido) ──
    # Cache agresivo: 1 año (el hash cambia si el contenido cambia)
    location ~* \.(js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── index.html — NUNCA cachear ──────────────────────────
    # El navegador debe siempre verificar si hay una versión nueva
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Favicon ─────────────────────────────────────────────
    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── SPA Routing (React Router) ──────────────────────────
    # Cualquier ruta que no sea un archivo estático real
    # devuelve index.html para que React Router la maneje
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Ocultar versión de Nginx ────────────────────────────
    server_tokens off;

    # ── Límite de tamaño de request (fotos de evidencia) ────
    # El frontend hace peticiones al backend directamente, no a nginx.
    # Este límite aplica solo para assets servidos por nginx.
    client_max_body_size 20M;

    # ── Logs ────────────────────────────────────────────────
    access_log /var/log/nginx/narbus_access.log;
    error_log  /var/log/nginx/narbus_error.log warn;
}
